name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          # Versions come from mise.toml. The DSH CLI is not needed to build or test.
          install_args: node pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      # The host suite loads lib/, so the committed build has to be the build of this tree.
      - name: lib/ matches src
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            git status --porcelain -- lib
            echo "::error::committed lib/ is not the build of this tree; run pnpm run build and commit the result"
            exit 1
          fi
